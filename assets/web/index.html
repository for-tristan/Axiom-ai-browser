  <script type="module" crossorigin src="./assets/index-Dxx4WaSj.js"></script>

  <!-- ===== 1) أخفي شريط التابات و الـ navigation bar من الـ HTML ===== -->
  <style>
    .top-tab-bar,
    .navigation-bar {

    .panel-search input, .panel-search input::placeholder { color: #e5e7eb !important; }
    .panel-search i { color: #c5c2d6 !important; }
    .menu-section-label { color: #b8b4cc !important; }
    .nav-item { color: #e5e7eb !important; }

    .nav-item .nav-icon { color: #d1d5db !important; }

    .nav-item.active .nav-icon { color: #ffffff !important; }

    .sidebar-toggle { color: #e5e7eb !important; background-color: rgba(255,255,255,0.06) !important; border-color: rgba(255,255,255,0.12) !important; }

<body>
<div id="root"></div>

<!-- ===== 4) Flutter bridge: لما تضغط History/Bookmarks/Profile يبعت للـ Flutter ===== -->
<script>
  // نستنى لحد ما الـ React يرندر، وبعدين نلصق الـ listeners على الأزرار
  (function () {
    // تعريف قناة التواصل مع Flutter (لو موجودة)
    function postToFlutter(msg) {
      try {
        window.AxiomHost && window.AxiomHost.postMessage(msg);
      } catch (e) {}
    }

    function findNavButton(label) {
      const buttons = document.querySelectorAll('.nav-item, .rail-btn');
      for (const btn of buttons) {
        const text = (btn.textContent || '').trim().toLowerCase();
        const titleAttr = (btn.getAttribute('title') || '').trim().toLowerCase();
        const ariaLabel = (btn.getAttribute('aria-label') || '').trim().toLowerCase();
        if (text === label || titleAttr === label || ariaLabel === label) {
          return btn;
        }
      }
      return null;
    }

    function findProfileButton() {
      return document.querySelector('.user-card');
    }

    function attachListeners() {
      const historyBtn = findNavButton('history');
      const bookmarksBtn = findNavButton('bookmarks');
      const profileBtn = findProfileButton();

      if (historyBtn) {
        historyBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          postToFlutter('history');
        }, true);
      }
      if (bookmarksBtn) {
        bookmarksBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          postToFlutter('bookmarks');
        }, true);
      }
      if (profileBtn) {
        profileBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          postToFlutter('profile');
        }, true);
      }
    }

    // نحاول نلصق الـ listeners بعد ما الـ React يخلص رندر
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(attachListeners, 300);
      setTimeout(attachListeners, 1000);
      setTimeout(attachListeners, 2000);
    });

    // Re-attach لو الـ React re-rendered وأمسح الـ listeners
    const observer = new MutationObserver(function () {
      setTimeout(attachListeners, 100);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  })();
</script>
</body>
</html>
