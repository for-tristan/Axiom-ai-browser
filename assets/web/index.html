<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axiom Browser</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script type="module" crossorigin src="./assets/index-Dxx4WaSj.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B1yCbUfv.css">

  <!-- ===== Hide the in-page HTML tab bar + navigation bar =====
       The Flutter app already renders its own native top tab bar and
       navigation bar (back / forward / reload + address field), so the
       duplicate chrome that ships inside the React bundle is hidden here
       to avoid two stacked bars at the top of the screen. -->
  <style>
    .top-tab-bar,
    .navigation-bar {
      display: none !important;
    }

    /* ===== Sidebar: same hue, slightly darker / more solid =====
       The original sidebar uses a translucent glassy overlay which lets
       the page behind bleed through and wash out the text. These rules
       deepen the background so the panel reads as more solid, and lift
       the brightness of every text label / icon inside it. */
    .sidebar,
    .sidebar-panel,
    .sidebar-rail {
      background-color: #13111f !important;
      background-image: none !important;
      backdrop-filter: none !important;
    }

    /* Brand text */
    .brand-name {
      color: #ffffff !important;
    }
    .brand-sub {
      color: #c5c2d6 !important;
    }

    /* Panel search field */
    .panel-search {
      background-color: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.18) !important;
    }
    .panel-search input,
    .panel-search input::placeholder {
      color: #e5e7eb !important;
    }
    .panel-search i {
      color: #c5c2d6 !important;
    }

    /* Menu section labels (MAIN / PREFERENCES) */
    .menu-section-label {
      color: #b8b4cc !important;
    }

    /* Menu items (History / Bookmarks / Downloads / Settings) */
    .nav-item {
      color: #e5e7eb !important;
    }
    .nav-item:hover {
      color: #ffffff !important;
      background-color: rgba(255, 255, 255, 0.08) !important;
    }
    .nav-item .nav-icon {
      color: #d1d5db !important;
    }
    .nav-item.active {
      color: #ffffff !important;
    }
    .nav-item.active .nav-icon {
      color: #ffffff !important;
    }

    /* Menu empty state */
    .menu-empty {
      color: #9ca3af !important;
    }

    /* Weather card */
    .weather-card .weather-icon {
      color: #fbbf24 !important;
    }
    .weather-temp {
      color: #ffffff !important;
    }
    .weather-location {
      color: #d1d5db !important;
    }

    /* User card */
    .user-card .user-avatar {
      background-color: rgba(255, 255, 255, 0.12) !important;
      color: #ffffff !important;
    }
    .user-card .user-name {
      color: #ffffff !important;
    }
    .user-card .user-sub {
      color: #c5c2d6 !important;
    }
    .user-card .user-chevron {
      color: #c5c2d6 !important;
    }
    .user-card:hover {
      background-color: rgba(255, 255, 255, 0.06) !important;
    }

    /* Collapsed rail (when sidebar is closed) */
    .sidebar-rail .rail-btn {
      color: #d1d5db !important;
    }
    .sidebar-rail .rail-btn.active {
      color: #ffffff !important;
      background-color: rgba(255, 255, 255, 0.10) !important;
    }
    .sidebar-rail .rail-divider {
      background-color: rgba(255, 255, 255, 0.10) !important;
    }

    /* Sidebar toggle button */
    .sidebar-toggle {
      color: #e5e7eb !important;
      background-color: rgba(255, 255, 255, 0.06) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
    }
    .sidebar-toggle:hover {
      background-color: rgba(255, 255, 255, 0.12) !important;
    }

    /* Scrim overlay (when sidebar is open) — keep it dark for focus */
    .sidebar-scrim {
      background-color: rgba(0, 0, 0, 0.45) !important;
    }
  </style>
</head>
<body>
<div id="root"></div>
</body>
</html>
